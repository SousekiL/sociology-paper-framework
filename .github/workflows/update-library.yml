name: Update literature library

on:
  schedule:
    - cron: "17 15 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Append current and historical metadata
        run: python scripts/update_literature_library.py --mode weekly
      - name: Select open-access full texts for review
        run: python scripts/build_fulltext_review_queue.py --max 3
      - name: Install PDF text extractor
        if: ${{ secrets.LLM_API_KEY != '' || secrets.OPENAI_API_KEY != '' }}
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Read selected open-access full texts
        if: ${{ secrets.LLM_API_KEY != '' || secrets.OPENAI_API_KEY != '' }}
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY || secrets.OPENAI_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL || 'https://api.openai.com/v1' }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'gpt-4.1-mini' }}
        run: python scripts/review_openaccess_fulltexts.py
      - name: Commit enriched library
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add library
          git commit -m "chore(library): enrich journal metadata"
          git push
